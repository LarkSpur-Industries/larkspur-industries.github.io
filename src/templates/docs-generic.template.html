<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/webp" href="content/logos/favicon-docs.webp">
    {{META_TAGS}}
    <title>{{PRODUCT_NAME}} Docs | LarkSpur Industries</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ── Layout: override global centering for full-width docs ── */
        html {
            /* clip instead of hidden — visually the same but does NOT create
               a scroll container, so position:sticky on .sidebar keeps working */
            overflow-x: clip;
        }

        body {
            align-items: stretch;
            justify-content: flex-start;
            padding: 0 !important;   /* kill the 20px body padding from style.css */
            margin: 0;
            min-height: 100vh;
            width: 100%;
            max-width: 100%;
            overflow-x: clip;
            box-sizing: border-box;
        }

        /* .container from style.css is max-width:600px centered — not used here.
           docs-root spans the full viewport. */
        .docs-root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* ── Progress bar ────────────────────────────────────────── */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: var(--accent);
            z-index: 200;
            transition: width 0.1s linear;
        }

        /* ── Top nav strip ───────────────────────────────────────── */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .top-nav-left {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            font-size: 0.78rem;
        }

        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Search trigger button */
        .search-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .search-trigger:hover {
            border-color: #555;
            color: var(--text-main);
        }

        .search-trigger .kbd {
            font-size: 0.7rem;
            background: #222;
            border: 1px solid #444;
            padding: 0 0.3rem;
            border-radius: 2px;
            color: #888;
            line-height: 1.6;
        }

        .search-icon {
            opacity: 0.6;
        }

        /* ── Doc layout ──────────────────────────────────────────── */
        .doc-layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 0;
            flex: 1;
        }

        /* ── Sidebar ─────────────────────────────────────────────── */
        .sidebar {
            border-right: 1px solid var(--border);
            position: sticky;
            top: 41px; /* height of top-nav */
            height: calc(100vh - 41px);
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
            background: #0a0a0a;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        /* Sidebar product header */
        .sidebar-header {
            padding: 1.25rem 1rem 1rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            transition: color 0.15s;
        }

        .sidebar-brand:hover { color: var(--text-main); }

        .sidebar-brand .flower {
            color: var(--accent);
            font-size: 0.85rem;
        }

        .sidebar-product-name {
            font-size: 0.92rem;
            font-weight: bold;
            color: var(--highlight);
            line-height: 1.3;
            margin-bottom: 0.3rem;
        }

        .sidebar-product-subtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Sidebar nav */
        .sidebar-nav {
            padding: 1rem 0 2rem;
            flex: 1;
        }

        .sidebar-section-label {
            font-size: 0.65rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #444;
            padding: 0 1rem 0.4rem;
            margin-top: 0.5rem;
        }

        .sidebar-nav a {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.35rem 1rem;
            color: #777;
            text-decoration: none;
            font-size: 0.82rem;
            line-height: 1.4;
            transition: color 0.15s, background 0.15s;
            border-left: 2px solid transparent;
            margin-left: -1px; /* overlap border-right of .sidebar */
        }

        .sidebar-nav a:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.03);
        }

        .sidebar-nav a.active {
            color: var(--accent);
            border-left-color: var(--accent);
            background: rgba(159, 122, 234, 0.06);
        }

        .sidebar-nav a[data-special="true"] {
            color: var(--gold);
        }

        .sidebar-nav a[data-special="true"]:hover {
            color: #e5b94a;
        }

        .sidebar-nav a[data-special="true"].active {
            color: var(--gold);
            border-left-color: var(--gold);
            background: rgba(214, 158, 46, 0.06);
        }

        /* ── Main content ────────────────────────────────────────── */
        .content-wrapper {
            padding: 2rem 3rem 4rem;
            min-width: 0; /* prevent grid blowout */
        }

        .content {
            max-width: 760px;
            line-height: 1.7;
            color: #ccc;
        }

        /* On very wide screens widen the sidebar slightly */
        @media (min-width: 1400px) {
            .doc-layout {
                grid-template-columns: 280px 1fr;
            }
        }

        /* Markdown content styling */
        .content h1 {
            color: var(--highlight);
            font-size: 1.9rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .content .doc-meta {
            font-size: 0.78rem;
            color: #555;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .content h2 {
            position: relative;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
            margin-top: 3rem;
            margin-bottom: 1rem;
            color: #fff;
            font-size: 1.3rem;
            scroll-margin-top: 60px;
        }

        .content h3 {
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
            color: #eee;
            font-size: 1.05rem;
            scroll-margin-top: 60px;
        }

        .content h4 {
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Anchor copy link */
        .content h2 .anchor-link,
        .content h3 .anchor-link {
            opacity: 0;
            margin-left: 0.4rem;
            color: #444;
            font-size: 0.8rem;
            text-decoration: none;
            transition: opacity 0.15s, color 0.15s;
            vertical-align: middle;
        }

        .content h2:hover .anchor-link,
        .content h3:hover .anchor-link {
            opacity: 1;
        }

        .content h2 .anchor-link:hover,
        .content h3 .anchor-link:hover {
            color: var(--accent);
        }

        .content p { margin-bottom: 1rem; }

        .content ul, .content ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        .content li { margin-bottom: 0.4rem; }

        .content code {
            background: #1c1c1c;
            padding: 2px 6px;
            border-radius: 2px;
            font-family: "Courier New", monospace;
            color: var(--gold);
            font-size: 0.88em;
            border: 1px solid #2a2a2a;
        }

        .content pre {
            background: #111;
            border: 1px solid var(--border);
            padding: 1rem 1.25rem;
            overflow-x: auto;
            margin: 1.25rem 0;
            border-radius: 2px;
            position: relative;
        }

        .content pre code {
            background: none;
            padding: 0;
            color: #ccc;
            border: none;
            font-size: 0.88em;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.87rem;
        }

        .content th, .content td {
            border: 1px solid var(--border);
            padding: 7px 10px;
            text-align: left;
        }

        .content th {
            background: #161616;
            color: #ddd;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }

        .content td:first-child { color: #bbb; }

        .content tr:hover td {
            background: rgba(255,255,255,0.015);
        }

        .content img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            margin: 1.5rem 0 0.5rem;
            display: block;
        }

        .content img + em {
            display: block;
            font-size: 0.78rem;
            color: #555;
            font-style: normal;
            margin-bottom: 1.5rem;
        }

        .content blockquote {
            border-left: 3px solid #333;
            padding: 0.75rem 1rem;
            margin: 1.25rem 0;
            color: #999;
            background: #0e0e0e;
        }

        .content blockquote p { margin: 0; }

        .content blockquote strong {
            color: #e07a3a;
        }

        .content a {
            color: var(--accent);
            text-decoration: none;
        }

        .content a:hover { text-decoration: underline; }

        /* Custom button */
        .content .md-button {
            display: inline-block;
            padding: 0.45rem 1rem;
            background: transparent;
            border: 1px solid #555;
            color: var(--text-main);
            text-align: center;
            text-decoration: none;
            font-size: 0.83rem;
            font-weight: bold;
            font-family: inherit;
            transition: background 0.1s, color 0.1s, border-color 0.1s;
            cursor: pointer;
            margin: 0.4rem 0.4rem 0.4rem 0;
        }

        .content .md-button:hover {
            background: var(--text-main);
            color: var(--bg);
            border-color: var(--text-main);
            text-decoration: none;
        }

        /* hr */
        .content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }

        /* ── Search overlay ──────────────────────────────────────── */
        .search-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            align-items: flex-start;
            justify-content: center;
            padding-top: 8vh;
        }

        .search-overlay.open {
            display: flex;
        }

        .search-modal {
            background: #111;
            border: 1px solid #333;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .search-input-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .search-input-row svg {
            color: #555;
            flex-shrink: 0;
        }

        #search-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
        }

        #search-input::placeholder { color: #444; }

        .search-close-key {
            font-size: 0.7rem;
            color: #555;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 0.15rem 0.4rem;
            border-radius: 2px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .search-results {
            max-height: 380px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        .search-results::-webkit-scrollbar { width: 4px; }
        .search-results::-webkit-scrollbar-thumb { background: #333; }

        .search-empty {
            padding: 2rem 1rem;
            text-align: center;
            color: #444;
            font-size: 0.85rem;
        }

        .search-result-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0.75rem 1rem;
            cursor: pointer;
            text-decoration: none;
            border-bottom: 1px solid #1a1a1a;
            transition: background 0.1s;
        }

        .search-result-item:hover,
        .search-result-item.focused {
            background: rgba(159, 122, 234, 0.08);
        }

        .search-result-item:last-child { border-bottom: none; }

        .result-heading {
            font-size: 0.88rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .result-heading mark {
            background: none;
            color: var(--accent);
            font-weight: bold;
        }

        .result-context {
            font-size: 0.77rem;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-context mark {
            background: none;
            color: #888;
        }

        .search-footer {
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            font-size: 0.7rem;
            color: #444;
        }

        .search-footer span { display: flex; align-items: center; gap: 0.3rem; }

        .search-footer .kbd {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 2px;
            padding: 0 0.3rem;
            color: #666;
        }

        /* ── Back to top ─────────────────────────────────────────── */
        #back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, border-color 0.2s, color 0.2s;
            z-index: 50;
            font-size: 1rem;
        }

        #back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #back-to-top:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Toast (copy link feedback) ─────────────────────────── */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #1e1e1e;
            border: 1px solid #333;
            color: #ccc;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Footer ──────────────────────────────────────────────── */
        .doc-footer {
            padding: 1.5rem 2.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
        }

        /* ── Mobile ──────────────────────────────────────────────── */
        .mobile-sidebar-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.3rem 0.5rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
        }

        @media (max-width: 768px) {
            .doc-layout {
                grid-template-columns: 1fr;
            }

            /* Measure nav height via JS and set --nav-h; fallback 41px */
            .sidebar {
                position: fixed;
                top: var(--nav-h, 41px);
                left: 0;
                width: 80vw;
                max-width: 300px;
                z-index: 90;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                background: #0d0d0d;
                border-right: 1px solid #333;
                /* Use dvh so the sidebar truly fills to the bottom of
                   the visible screen regardless of browser chrome */
                height: calc(100dvh - var(--nav-h, 41px));
                /* Fallback for browsers without dvh */
                height: calc(100vh - var(--nav-h, 41px));
            }

            .sidebar.open {
                transform: translateX(0);
            }

            /* Dim backdrop when sidebar is open */
            .sidebar-backdrop {
                display: none;
                position: fixed;
                inset: 0;
                top: var(--nav-h, 41px);
                background: rgba(0,0,0,0.55);
                z-index: 89;
            }

            .sidebar-backdrop.open {
                display: block;
            }

            .mobile-sidebar-toggle {
                display: block;
            }

            /* Hide keyboard shortcut hint — not useful on touch */
            .search-trigger .kbd {
                display: none;
            }

            .content-wrapper {
                padding: 1.5rem 1.1rem 3rem;
            }

            .content h1 { font-size: 1.5rem; }

            .content table {
                font-size: 0.8rem;
                display: block;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            #back-to-top {
                bottom: 1rem;
                right: 1rem;
            }

            .search-modal {
                max-width: calc(100vw - 2rem);
            }
        }
    </style>
</head>
<body>

<!-- Reading progress bar -->
<div id="progress-bar"></div>

<!-- Search overlay -->
<div class="search-overlay" id="search-overlay" role="dialog" aria-label="Search docs">
    <div class="search-modal">
        <div class="search-input-row">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input id="search-input" type="text" placeholder="Search docs…" autocomplete="off" spellcheck="false" />
            <span class="search-close-key" id="search-close-btn">ESC</span>
        </div>
        <div class="search-results" id="search-results">
            <div class="search-empty">Start typing to search…</div>
        </div>
        <div class="search-footer">
            <span><span class="kbd">↑↓</span> navigate</span>
            <span><span class="kbd">↵</span> select</span>
            <span><span class="kbd">ESC</span> close</span>
        </div>
    </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast">Link copied</div>

<!-- Back to top -->
<button id="back-to-top" title="Back to top" aria-label="Back to top">↑</button>

<!-- Sidebar backdrop (mobile) -->
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="docs-root">

    <!-- Sticky top nav -->
    <nav class="top-nav">
        <div class="top-nav-left">
            <button class="mobile-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰ MENU</button>
            <a href="index.html" class="link">← HOME</a>
            <a href="docs.html" class="link">ALL DOCS</a>
        </div>
        <div class="top-nav-right">
            <button class="search-trigger" id="search-open-btn" aria-label="Open search">
                <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                Search
                <span class="kbd">⌘K</span>
            </button>
        </div>
    </nav>

    <div class="doc-layout">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <span class="flower">❀</span> LARKSPUR INDUSTRIES
                </a>
                <div class="sidebar-product-name">{{PRODUCT_NAME}}</div>
                <div class="sidebar-product-subtitle">{{PRODUCT_SUBTITLE}}</div>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav" aria-label="Documentation navigation">
                <div class="sidebar-section-label">On this page</div>
{{SIDEBAR_CONTENT}}
            </nav>

        </aside>

        <!-- Main content -->
        <main>
            <div class="content-wrapper">
                <div class="content" id="doc-content">
{{MAIN_CONTENT}}
                </div>
            </div>
            <div class="doc-footer">
                <span>© 2025 LARKSPUR INDUSTRIES</span>
            </div>
        </main>

    </div>
</div>

<script>
(function () {
    // ── Sidebar mobile toggle ────────────────────────────────────
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('sidebar-toggle');
    const backdrop = document.getElementById('sidebar-backdrop');

    // Measure real nav height and set CSS variable so sidebar top/height
    // tracks accurately regardless of font scaling or padding changes
    function setNavHeight() {
        const nav = document.querySelector('.top-nav');
        if (nav) {
            document.documentElement.style.setProperty(
                '--nav-h', nav.getBoundingClientRect().height + 'px'
            );
        }
    }
    setNavHeight();
    window.addEventListener('resize', setNavHeight);

    function openSidebar() {
        sidebar.classList.add('open');
        backdrop.classList.add('open');
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        backdrop.classList.remove('open');
    }

    toggle.addEventListener('click', () => {
        sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });

    backdrop.addEventListener('click', closeSidebar);

    // ── Reading progress bar ─────────────────────────────────────
    const progressBar = document.getElementById('progress-bar');
    function updateProgress() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = pct + '%';
    }

    // ── Back to top ──────────────────────────────────────────────
    const backToTop = document.getElementById('back-to-top');
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    window.addEventListener('scroll', () => {
        updateProgress();
        backToTop.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });

    // ── Sidebar active state on scroll ───────────────────────────
    const navLinks = document.querySelectorAll('.sidebar-nav a[href^="#"]');
    const sections = Array.from(navLinks).map(link => {
        const id = link.getAttribute('href').slice(1);
        return document.getElementById(id);
    }).filter(Boolean);

    function updateActive() {
        let current = '';
        sections.forEach(section => {
            if (window.scrollY >= section.offsetTop - 80) {
                current = section.getAttribute('id');
            }
        });
        navLinks.forEach(link => {
            const active = link.getAttribute('href') === '#' + current;
            link.classList.toggle('active', active);
        });
    }

    window.addEventListener('scroll', updateActive, { passive: true });
    updateActive();

    // Smooth scroll + close sidebar on mobile
    navLinks.forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            const target = document.querySelector(link.getAttribute('href'));
            if (target) {
                closeSidebar();
                setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
            }
        });
    });

    // ── Anchor copy links ────────────────────────────────────────
    const toast = document.getElementById('toast');
    let toastTimer;

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.querySelectorAll('.content h2[id], .content h3[id]').forEach(heading => {
        const anchor = document.createElement('a');
        anchor.className = 'anchor-link';
        anchor.href = '#' + heading.id;
        anchor.title = 'Copy link';
        anchor.textContent = '#';
        anchor.addEventListener('click', e => {
            e.preventDefault();
            const url = window.location.origin + window.location.pathname + '#' + heading.id;
            navigator.clipboard.writeText(url).then(() => showToast('Link copied'));
            history.pushState(null, '', '#' + heading.id);
        });
        heading.appendChild(anchor);
    });

    // ── Search ───────────────────────────────────────────────────
    // Build index from headings + their text content
    const searchIndex = [];

    document.querySelectorAll('.content h2[id], .content h3[id]').forEach(heading => {
        // Collect following paragraph text as context
        let contextParts = [];
        let sibling = heading.nextElementSibling;
        let count = 0;
        while (sibling && count < 3) {
            const tag = sibling.tagName.toLowerCase();
            if (/^h[123]$/.test(tag)) break;
            if (tag === 'p') {
                contextParts.push(sibling.textContent.trim());
                count++;
            }
            sibling = sibling.nextElementSibling;
        }

        searchIndex.push({
            id: heading.id,
            level: parseInt(heading.tagName[1]),
            title: heading.textContent.replace('#', '').trim(),
            context: contextParts.join(' ').slice(0, 200)
        });
    });

    const overlay = document.getElementById('search-overlay');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const openBtn = document.getElementById('search-open-btn');
    const closeBtn = document.getElementById('search-close-btn');

    let focusedIndex = -1;

    function openSearch() {
        overlay.classList.add('open');
        searchInput.value = '';
        renderResults('');
        requestAnimationFrame(() => searchInput.focus());
        focusedIndex = -1;
    }

    function closeSearch() {
        overlay.classList.remove('open');
        searchInput.blur();
    }

    openBtn.addEventListener('click', openSearch);
    closeBtn.addEventListener('click', closeSearch);

    overlay.addEventListener('click', e => {
        if (e.target === overlay) closeSearch();
    });

    // Keyboard shortcut: Cmd+K / Ctrl+K
    document.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            overlay.classList.contains('open') ? closeSearch() : openSearch();
        }
        if (e.key === 'Escape' && overlay.classList.contains('open')) {
            closeSearch();
        }
        if (overlay.classList.contains('open')) {
            const items = searchResults.querySelectorAll('.search-result-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                focusedIndex = Math.min(focusedIndex + 1, items.length - 1);
                updateFocus(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                focusedIndex = Math.max(focusedIndex - 1, 0);
                updateFocus(items);
            } else if (e.key === 'Enter') {
                if (focusedIndex >= 0 && items[focusedIndex]) {
                    items[focusedIndex].click();
                }
            }
        }
    });

    function updateFocus(items) {
        items.forEach((item, i) => item.classList.toggle('focused', i === focusedIndex));
        if (items[focusedIndex]) {
            items[focusedIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    function highlight(text, query) {
        if (!query) return text;
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }

    function renderResults(query) {
        focusedIndex = -1;
        const q = query.trim().toLowerCase();

        if (!q) {
            searchResults.innerHTML = '<div class="search-empty">Start typing to search…</div>';
            return;
        }

        const matches = searchIndex.filter(item =>
            item.title.toLowerCase().includes(q) ||
            item.context.toLowerCase().includes(q)
        );

        if (!matches.length) {
            searchResults.innerHTML = '<div class="search-empty">No results for "' + query + '"</div>';
            return;
        }

        searchResults.innerHTML = matches.map(item => `
            <a class="search-result-item" href="#${item.id}" data-id="${item.id}">
                <span class="result-heading">${highlight(item.title, query)}</span>
                ${item.context ? `<span class="result-context">${highlight(item.context.slice(0, 120), query)}</span>` : ''}
            </a>
        `).join('');

        searchResults.querySelectorAll('.search-result-item').forEach(el => {
            el.addEventListener('click', e => {
                e.preventDefault();
                const target = document.getElementById(el.dataset.id);
                if (target) {
                    closeSearch();
                    setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
                }
            });
        });
    }

    searchInput.addEventListener('input', () => renderResults(searchInput.value));
})();
</script>
</body>
</html>
