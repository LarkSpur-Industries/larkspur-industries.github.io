<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title description">
  <title id="title">Locking cable voltage drop comparison</title>
  <desc id="description">Line graph comparing Larkspur Cable voltage drop with a competitor at 3, 6, and 9 amps.</desc>
  <rect width="900" height="520" rx="12" fill="#111111"/>
  <rect x="1" y="1" width="898" height="518" rx="11" fill="none" stroke="#252525" stroke-width="2"/>

  <g font-family="Ubuntu, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-style="normal">
    <text x="64" y="54" fill="#f7f7f7" font-size="24" font-weight="700">Voltage drop under load</text>
    <text x="64" y="80" fill="#8a8a8a" font-size="14">Lower is better. Results use a 5.1V source.</text>

    <g stroke="#2b2b2b" stroke-width="1">
      <line x1="112" y1="112" x2="836" y2="112"/>
      <line x1="112" y1="207" x2="836" y2="207"/>
      <line x1="112" y1="302" x2="836" y2="302"/>
      <line x1="112" y1="397" x2="836" y2="397"/>
    </g>

    <g fill="#8a8a8a" font-size="13" text-anchor="end">
      <text x="96" y="117">0.9V</text>
      <text x="96" y="212">0.6V</text>
      <text x="96" y="307">0.3V</text>
      <text x="96" y="402">0.0V</text>
    </g>

    <g fill="#b0b0b0" font-size="14" text-anchor="middle">
      <text x="176" y="429">3A</text>
      <text x="474" y="429">6A</text>
      <text x="772" y="429">9A</text>
    </g>
    <text x="474" y="456" fill="#777777" font-size="13" text-anchor="middle">Load</text>

    <polyline points="176,308 474,219 772,130" fill="none" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#777777">
      <circle cx="176" cy="308" r="5"/>
      <circle cx="474" cy="219" r="5"/>
      <circle cx="772" cy="130" r="5"/>
    </g>

    <polyline points="176,356 474,310 772,260" fill="none" stroke="#a98bea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a98bea" stroke="#e6dcff" stroke-width="2">
      <circle cx="176" cy="356" r="7"/>
      <circle cx="474" cy="310" r="7"/>
      <circle cx="772" cy="260" r="7"/>
    </g>

    <g fill="#e6dcff" font-size="13" font-weight="700" text-anchor="middle">
      <text x="176" y="382">0.128V</text>
      <text x="474" y="336">0.274V</text>
      <text x="772" y="286">0.432V</text>
    </g>

    <g font-size="13">
      <line x1="250" y1="486" x2="282" y2="486" stroke="#a98bea" stroke-width="5" stroke-linecap="round"/>
      <text x="292" y="491" fill="#f7f7f7" font-weight="700">Larkspur Cable</text>

      <line x1="502" y1="486" x2="534" y2="486" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
      <text x="544" y="491" fill="#b0b0b0">Competitor</text>
    </g>
  </g>
</svg>
