<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="title description">
  <title id="title">Locking cable voltage drop comparison</title>
  <desc id="description">Line graph comparing Larkspur Cable voltage drop with a competitor at 3, 6, and 9 amps.</desc>
  <rect width="420" height="560" rx="12" fill="#111111"/>
  <rect x="1" y="1" width="418" height="558" rx="11" fill="none" stroke="#252525" stroke-width="2"/>

  <g font-family="Ubuntu, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-style="normal">
    <text x="28" y="44" fill="#f7f7f7" font-size="22" font-weight="700">Voltage drop under load</text>
    <text x="28" y="70" fill="#8a8a8a" font-size="13">Lower is better. Results use a 5.1V source.</text>

    <g stroke="#2b2b2b" stroke-width="1">
      <line x1="62" y1="100" x2="392" y2="100"/>
      <line x1="62" y1="200" x2="392" y2="200"/>
      <line x1="62" y1="300" x2="392" y2="300"/>
      <line x1="62" y1="400" x2="392" y2="400"/>
    </g>

    <g fill="#8a8a8a" font-size="12" text-anchor="end">
      <text x="52" y="105">0.9V</text>
      <text x="52" y="205">0.6V</text>
      <text x="52" y="305">0.3V</text>
      <text x="52" y="405">0.0V</text>
    </g>

    <g fill="#b0b0b0" font-size="14" text-anchor="middle">
      <text x="100" y="430">3A</text>
      <text x="227" y="430">6A</text>
      <text x="354" y="430">9A</text>
    </g>
    <text x="227" y="457" fill="#777777" font-size="13" text-anchor="middle">Load</text>

    <polyline points="100,306 227,213 354,119" fill="none" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#777777">
      <circle cx="100" cy="306" r="5"/>
      <circle cx="227" cy="213" r="5"/>
      <circle cx="354" cy="119" r="5"/>
    </g>

    <polyline points="100,357 227,309 354,256" fill="none" stroke="#a98bea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a98bea" stroke="#e6dcff" stroke-width="2">
      <circle cx="100" cy="357" r="7"/>
      <circle cx="227" cy="309" r="7"/>
      <circle cx="354" cy="256" r="7"/>
    </g>

    <g fill="#e6dcff" font-size="12" font-weight="700" text-anchor="middle">
      <text x="100" y="383">0.128V</text>
      <text x="227" y="335">0.274V</text>
      <text x="354" y="282">0.432V</text>
    </g>

    <g font-size="13">
      <line x1="66" y1="493" x2="98" y2="493" stroke="#a98bea" stroke-width="5" stroke-linecap="round"/>
      <text x="108" y="498" fill="#f7f7f7" font-weight="700">Larkspur Cable</text>

      <line x1="66" y1="527" x2="98" y2="527" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
      <text x="108" y="532" fill="#b0b0b0">Competitor</text>
    </g>
  </g>
</svg>
