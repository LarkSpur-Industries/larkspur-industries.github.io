<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="title description">
  <title id="title">Marigold-5 brownout performance</title>
  <desc id="description">Line graph of output voltage as input voltage falls from 6.5V to 5V at 3, 5, and 7 amps.</desc>
  <rect width="420" height="560" rx="12" fill="#111111"/>
  <rect x="1" y="1" width="418" height="558" rx="11" fill="none" stroke="#252525" stroke-width="2"/>

  <g font-family="Ubuntu, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-style="normal">
    <text x="28" y="44" fill="#f7f7f7" font-size="22" font-weight="700">Output during input sag</text>
    <text x="28" y="70" fill="#8a8a8a" font-size="13">Output at the cable end. Higher and flatter is better.</text>

    <g stroke="#2b2b2b" stroke-width="1">
      <line x1="62" y1="100" x2="392" y2="100"/>
      <line x1="62" y1="200" x2="392" y2="200"/>
      <line x1="62" y1="300" x2="392" y2="300"/>
      <line x1="62" y1="400" x2="392" y2="400"/>
    </g>

    <g fill="#8a8a8a" font-size="12" text-anchor="end">
      <text x="52" y="105">5.1V</text>
      <text x="52" y="205">4.9V</text>
      <text x="52" y="305">4.7V</text>
      <text x="52" y="405">4.5V</text>
    </g>

    <g fill="#b0b0b0" font-size="14" text-anchor="middle">
      <text x="62" y="430">5.0V</text>
      <text x="172" y="430">5.5V</text>
      <text x="282" y="430">6.0V</text>
      <text x="392" y="430">6.5V</text>
    </g>
    <text x="227" y="457" fill="#777777" font-size="13" text-anchor="middle">Input voltage</text>

    <line x1="282" y1="100" x2="282" y2="400" stroke="#555555" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="290" y="375" fill="#8a8a8a" font-size="13">Rated minimum</text>
    <text x="282" y="231" fill="#e6dcff" font-size="13" font-weight="700" text-anchor="middle">4.807V</text>
    
    <polyline points="392,150 348,150 304,150 282,150 260,150 238,150 216,149 194,149 172,168 150,216 128,265 106,314 84,363" fill="none" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="392,196 348,196 304,196 282,196 260,196 238,198 216,223 194,271 172,321 150,370" fill="none" stroke="#cdbdf4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="392,246 348,247 304,246 282,247 260,294 238,346 216,396" fill="none" stroke="#a98bea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a98bea" stroke="#e6dcff" stroke-width="2">
      <circle cx="282" cy="247" r="7"/>
    </g>

    <g font-size="13">
      <line x1="66" y1="485" x2="98" y2="485" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
      <text x="108" y="490" fill="#b0b0b0">3A</text>
      <line x1="66" y1="507" x2="98" y2="507" stroke="#cdbdf4" stroke-width="4" stroke-linecap="round"/>
      <text x="108" y="512" fill="#b0b0b0">5A</text>
      <line x1="66" y1="529" x2="98" y2="529" stroke="#a98bea" stroke-width="5" stroke-linecap="round"/>
      <text x="108" y="534" fill="#f7f7f7" font-weight="700">7A</text>
    </g>
  </g>
</svg>
