<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title description">
  <title id="title">Marigold-5 7A thermal soak</title>
  <desc id="description">Line graph of output voltage over 60 minutes at 7 amps, mounted to aluminum versus not mounted.</desc>
  <rect width="900" height="520" rx="12" fill="#111111"/>
  <rect x="1" y="1" width="898" height="518" rx="11" fill="none" stroke="#252525" stroke-width="2"/>

  <g font-family="Ubuntu, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-style="normal">
    <text x="64" y="54" fill="#f7f7f7" font-size="24" font-weight="700">7A continuous load</text>
    <text x="64" y="80" fill="#8a8a8a" font-size="14">12V input, sealed case, still air.</text>

    <g stroke="#2b2b2b" stroke-width="1">
      <line x1="112" y1="112" x2="836" y2="112"/>
      <line x1="112" y1="207" x2="836" y2="207"/>
      <line x1="112" y1="302" x2="836" y2="302"/>
      <line x1="112" y1="397" x2="836" y2="397"/>
    </g>

    <g fill="#8a8a8a" font-size="13" text-anchor="end">
      <text x="96" y="117">4.82V</text>
      <text x="96" y="212">4.78V</text>
      <text x="96" y="307">4.74V</text>
      <text x="96" y="402">4.70V</text>
    </g>

    <g fill="#b0b0b0" font-size="14" text-anchor="middle">
      <text x="112" y="429">0</text>
      <text x="293" y="429">15</text>
      <text x="474" y="429">30</text>
      <text x="655" y="429">45</text>
      <text x="836" y="429">60</text>
    </g>
    <text x="474" y="456" fill="#777777" font-size="13" text-anchor="middle">Minutes</text>

    <line x1="339" y1="311" x2="339" y2="397" stroke="#777777" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="347" y="361" fill="#b0b0b0" font-size="13">Thermal shutdown</text>
    <text x="347" y="378" fill="#8a8a8a" font-size="13">at 18.8 min</text>
    <text x="836" y="282" fill="#e6dcff" font-size="13" font-weight="700" text-anchor="end">60 min, no shutdown</text>
    
    <polyline points="118,194 130,226 142,243 154,253 166,265 178,273 190,277 202,284 215,290 227,290 239,293 251,296 263,296 275,297 287,301 299,304 311,304 323,305 335,305 347,306 359,307 371,300 384,300 396,298 408,297 420,298 432,299 444,293 456,296 468,294 480,298 492,292 504,297 516,296 528,301 540,301 552,303 564,299 577,297 589,296 601,295 613,296 625,296 637,295 649,298 661,297 673,298 685,301 697,303 709,307 721,304 733,299 746,303 758,302 770,301 782,294 794,294 806,295 818,297 830,297 842,300" fill="none" stroke="#a98bea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a98bea" stroke="#e6dcff" stroke-width="2">
      <circle cx="842" cy="300" r="7"/>
    </g>
    <polyline points="118,190 130,212 142,233 154,248 166,261 178,269 190,276 202,284 215,289 227,292 239,292 251,298 263,303 275,309 287,309 299,311 311,313 323,314 335,311 339,311" fill="none" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#777777">
      <circle cx="339" cy="311" r="5"/>
    </g>

    <g font-size="13">
      <line x1="152" y1="486" x2="184" y2="486" stroke="#a98bea" stroke-width="5" stroke-linecap="round"/>
      <text x="194" y="491" fill="#f7f7f7" font-weight="700">Mounted to aluminum</text>
      <line x1="474" y1="486" x2="506" y2="486" stroke="#777777" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
      <text x="516" y="491" fill="#b0b0b0">Not mounted</text>
    </g>
  </g>
</svg>
