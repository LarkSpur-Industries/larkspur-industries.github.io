<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/webp" href="content/logos/favicon-docs.webp">
    <title>MARIGOLD-5 LOCKING CABLE | LarkSpur Industries</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            align-items: flex-start;
            padding-top: 40px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        
        .doc-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .sidebar {
            border-right: 1px solid var(--border);
            padding-right: 1rem;
            position: sticky;
            top: 40px;
            align-self: start;
        }
        .sidebar a {
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .sidebar a:hover { color: var(--text-main); }
        .sidebar .active { color: var(--accent); font-weight: bold; }
        
        .content {
            line-height: 1.6;
            color: #ccc;
        }
        
        /* Markdown content styling */
        .content h1 {
            color: var(--highlight);
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .content h2 {
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: #fff;
            font-size: 1.4rem;
        }
        .content h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            color: #eee;
            font-size: 1.1rem;
        }
        .content h4 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .content p {
            margin-bottom: 1rem;
        }
        
        .content ul, .content ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }
        
        .content li {
            margin-bottom: 0.5rem;
        }
        
        .content code {
            background: #222;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
            color: var(--gold);
            font-size: 0.9em;
        }
        
        .content pre {
            background: #1a1a1a;
            border: 1px solid var(--border);
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            border-radius: 3px;
        }
        
        .content pre code {
            background: none;
            padding: 0;
            color: #ccc;
        }
        
        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }
        .content th, .content td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: left;
        }
        .content th {
            background: #222;
            color: #fff;
            font-weight: bold;
        }
        
        .content img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            margin: 1.5rem 0;
        }
        
        .content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            margin: 1rem 0;
            color: #aaa;
            font-style: italic;
        }
        
        .content a {
            color: var(--accent);
            text-decoration: none;
        }
        .content a:hover {
            text-decoration: underline;
        }
        
        /* Custom button styling from markdown */
        .content .md-button {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.1s, color 0.1s;
            cursor: pointer;
            margin: 0.5rem 0.5rem 0.5rem 0;
        }
        
        .content .md-button:hover {
            background: var(--text-main);
            color: var(--bg);
            text-decoration: none;
        }
        
        @media (max-width: 768px) {
            body {
                padding-top: 20px;
            }
            .doc-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding-bottom: 1rem;
                margin-bottom: 1rem;
                position: static;
            }
            .content table {
                font-size: 0.8rem;
            }
            .content th, .content td {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 1rem; font-size: 0.8rem; display:flex; justify-content:space-between; flex-wrap: wrap; gap: 0.5rem;">
            <a href="index.html" class="link"><- HOME</a>
            <a href="docs.html" class="link">ALL DOCS</a>
        </div>
        <div class="header">
            <div>
                <span>MARIGOLD-5 LOCKING CABLE</span>
            </div>
    
        </div>

        <div class="doc-layout">
            <div class="sidebar">

            </div>

            <div class="content">
<h1>Marigold-5 Locking Cable</h1>
<h3>More coming soon!</h3>

            </div>
        </div>

        <div class="footer">
            <span>© 2025 LARKSPUR INDUSTRIES</span>
        </div>
    </div>

    <script>
        // Smooth scroll and active state management
        const links = document.querySelectorAll('.sidebar a[href^="#"]');
        const sections = Array.from(links).map(link => {
            const id = link.getAttribute('href').slice(1);
            return document.getElementById(id);
        }).filter(Boolean);
        
        // Smooth scroll on click
        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.querySelector(link.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    // Update active state
                    links.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                }
            });
        });
        
        // Update active state on scroll
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (window.pageYOffset >= sectionTop - 100) {
                    current = section.getAttribute('id');
                }
            });
            
            links.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === `#${current}`) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
